# Blank issues stay on: Settings, Report a Problem opens /issues/new with the Mac's details filled in.
blank_issues_enabled: true
contact_links:
  - name: Security problem
    url: https://github.com/patebry/spacebar/security/advisories/new
    about: Report it privately (SECURITY.md), not in a public issue.
  - name: Question or idea
    url: https://github.com/patebry/spacebar/discussions
    about: How something works, or an idea that is not yet a request.
