name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        # Apple's Quick Look generators may not answer on a runner: test/qlpane skips its renders.
        env:
          QLPANE_RENDER: '0'
        run: for t in settings scheme linkpolicy cas editkeys pdfpane htmlpane mediapane qlpane imagepane diskimage richtext encoding archive filterkeys rivals updates report welcome helper; do test/$t/run.sh; done

      # The Space helper's viewer off screen: what a suspended, restored, closed or replaced panel shows is graded; a shared
      # runner's timings and memory are printed, not graded.
      - name: Viewer checks
        env:
          LATENCY_TARGETS: '0'
          RUNS: '5'
        run: test/viewerlatency/run.sh

      # Large files through the same off-screen viewer: each is shown whole; the main-thread stall and memory targets are
      # printed, not graded.
      - name: Large files
        env:
          PERF_TARGETS: '0'
        run: test/bigfiles/run.sh

      # Day-in-the-life flows through the same off-screen viewer, over a corpus made at test time. Timings are printed, not
      # graded; without ffmpeg on the runner the video and audio flow is skipped.
      - name: Scenarios
        env:
          SCEN_TIMING: '0'
        run: test/scenarios/run.sh

      # Whole editing sessions typed into the real writer in-process, in the panel's viewer and in Quick Look's controller, each
      # saved file checked byte for byte.
      - name: Editing
        run: test/editflows/run.sh

      # One stable identity for every release keeps the designated requirement the same, so an update does not make macOS
      # ask again about the extension's sandbox container (FINDINGS.md). Forks without the secrets build ad-hoc.
      - name: Signing identity
        env:
          P12: ${{ secrets.SPACEBAR_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SPACEBAR_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::warning title=Ad-hoc signed::SPACEBAR_SIGNING_P12 or SPACEBAR_SIGNING_PASSWORD is not set, so this build is ad-hoc signed. Its signer changes with every build, and users updating to it may see a macOS data-sharing prompt."
            echo "SIGN_ID=-" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/spacebar-signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          echo "::add-mask::$kcpw"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          # codesign finds the certificate only through the keychain search list.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $existing
          security find-identity -p codesigning "$kc" | grep -q '"spacebar Release"' ||
            { echo "::error::SPACEBAR_SIGNING_P12 holds no \"spacebar Release\" identity"; exit 1; }
          { echo "SIGN_ID=spacebar Release"; echo "SIGN_KEYCHAIN=$kc"; } >> "$GITHUB_ENV"

      # The helper's XPC gate against clients signed with this identity; skipped for an ad-hoc build. It bootstraps a test
      # launchd job in the runner's GUI domain and removes it; without that domain it warns and skips.
      - name: Helper link
        env:
          HELPERLINK_OPTIONAL: '1'
        run: test/helperlink/run.sh

      - name: Build (universal, not installed)
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build.sh --no-install

      # The built plists claim exactly scripts/quicklook-types.txt, and the helper's and viewer's bundles have their layout,
      # entitlements, hardened runtime and signatures; checked on this build, not a rebuild.
      - name: Quick Look claims and helper bundles
        run: SKIP_BUILD=1 test/claims/run.sh

      - name: Check and package
        working-directory: build
        run: |
          count=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            archs=$(lipo -archs "$f")
            echo "$archs  $f"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$f has no arm64 slice"; exit 1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$f has no x86_64 slice"; exit 1 ;; esac
            count=$((count + 1))
          done < <(find spacebar.app -path '*/MacOS/*' -type f -print0)
          # The app, two extensions and their writers, the Space helper, its viewer and the viewer's writer.
          [ "$count" -ge 8 ] || { echo "::error::expected at least 8 executables under */MacOS/*, found $count"; exit 1; }
          codesign --verify --deep --strict spacebar.app
          for b in "spacebar.app/Contents/Helpers/spacebar Helper.app" "spacebar.app/Contents/Helpers/spacebar Viewer.app"; do
            codesign --verify --strict "$b"
            codesign -dv "$b" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::$b is not signed with the hardened runtime"; exit 1; }
          done
          codesign -d -r- spacebar.app
          ditto -c -k --keepParent spacebar.app spacebar.zip
          shasum -a 256 spacebar.zip > spacebar.zip.sha256
          cat spacebar.zip.sha256

      # From v0.3 a release ships only notarized and stapled: without the credentials, or if Apple refuses the build, the
      # release fails here. Earlier tags skip this. The credentials, Developer ID signing and the .dmg come with P6.
      - name: Notarize (v0.3 and later)
        env:
          NOTARY_KEY: ${{ secrets.SPACEBAR_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.SPACEBAR_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.SPACEBAR_NOTARY_ISSUER }}
        run: |
          v=${GITHUB_REF_NAME#v}
          if [ "$(printf '0.3.0\n%s\n' "$v" | sort -V | head -1)" != 0.3.0 ]; then
            echo "$GITHUB_REF_NAME is before v0.3: not notarized"
            exit 0
          fi
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "::error title=Not notarized::$GITHUB_REF_NAME needs SPACEBAR_NOTARY_KEY, SPACEBAR_NOTARY_KEY_ID and SPACEBAR_NOTARY_ISSUER: from v0.3 every release is notarized"
            exit 1
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" > "$key"
          xcrun notarytool submit build/spacebar.zip --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
          [ "$status" = Accepted ] || { echo "::error title=Not notarized::notarytool status: ${status:-none}"; exit 1; }
          xcrun stapler staple build/spacebar.app
          xcrun stapler validate build/spacebar.app
          # The zip is made again from the stapled app, and its checksum with it.
          cd build
          rm -f spacebar.zip spacebar.zip.sha256
          ditto -c -k --keepParent spacebar.app spacebar.zip
          shasum -a 256 spacebar.zip > spacebar.zip.sha256
          cat spacebar.zip.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/spacebar.zip

      - name: Release notes
        run: |
          sum=$(awk '{ print $1; exit }' build/spacebar.zip.sha256)
          if [ "$SIGN_ID" = - ]; then
            signing="This build is ad-hoc signed, so its signer differs from every other release's: macOS may show a data-sharing prompt when you update to it."
          else
            signing="Releases are signed with one stable, self-signed identity (\"spacebar Release\"). If you are upgrading from v0.1.0, which was ad-hoc signed, you may see one macOS prompt about spacebar's data; allow it. Later updates keep the same signer and should not ask again."
          fi
          # The Gatekeeper paragraph lives in README.md only, between its gatekeeper markers.
          gatekeeper=$(sed -n '/^<!-- gatekeeper/,/^<!-- \/gatekeeper -->/{/^<!--/d;p;}' README.md)
          [ -n "$gatekeeper" ] || { echo "::error::README.md has no gatekeeper paragraph"; exit 1; }
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          \`\`\`sh
          curl -fsSL https://spacebar.patebryant.com/install.sh | sh
          \`\`\`

          $gatekeeper

          $signing

          ## Uninstall

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/patebry/spacebar/main/scripts/uninstall.sh | sh
          \`\`\`

          ## Verify

          SHA-256 of \`spacebar.zip\`: \`$sum\`

          \`\`\`sh
          gh attestation verify spacebar.zip -R patebry/spacebar
          \`\`\`
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" build/spacebar.zip build/spacebar.zip.sha256
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "spacebar $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
